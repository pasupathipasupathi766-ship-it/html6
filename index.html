
<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered List</title>
</head>
<body>
    <h2>Ordered List</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Cricket</li>
        <li>Football</li>
        <li>Hockey</li>
        <li>Tennis</li>
    </ul>
</body>
</html>
